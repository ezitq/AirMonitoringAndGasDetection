<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація | IoT Air Monitoring</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f2937, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            margin: 0;
            font-size: 28px;
            color: #111827;
        }

        .register-header p {
            margin-top: 10px;
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .register-button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .register-button:hover {
            background: #1d4ed8;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .system-name {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        .hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="register-container">

    <div class="register-header">
        <h1>Реєстрація</h1>
        <p>Створення облікового запису для IoT-системи моніторингу</p>
    </div>

    <div th:if="${error}" class="message error" th:text="${error}">
        Помилка реєстрації.
    </div>

    <form action="/register" method="post">

        <div class="form-group">
            <label for="fullName">Ім’я користувача</label>
            <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Наприклад: Богдан Нечай"
                    required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Введіть email"
                    required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Створіть пароль"
                    minlength="6"
                    required>
            <div class="hint">Мінімальна довжина пароля — 6 символів.</div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Підтвердження пароля</label>
            <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Повторіть пароль"
                    minlength="6"
                    required>
        </div>

        <div class="form-group">
            <label for="pairingCode">Код прив’язки пристрою</label>
            <input
                    type="text"
                    id="pairingCode"
                    name="pairingCode"
                    placeholder="Наприклад: 482913"
                    required>
            <div class="hint">Код відображається на TFT-дисплеї пристрою під час першого налаштування.</div>
        </div>

        <button type="submit" class="register-button">
            Зареєструватися
        </button>

    </form>

    <div class="login-link">
        Уже маєте акаунт?
        <a th:href="@{/login}">Увійти</a>
    </div>

    <div class="system-name">
        Intelligent IoT Air Monitoring System
    </div>

</div>

</body>
</html>
